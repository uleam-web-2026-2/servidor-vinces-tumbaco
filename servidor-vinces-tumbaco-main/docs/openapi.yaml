openapi: 3.1.0

info:
  title: Plataforma de Intercambio de Libros Usados
  version: 1.1.0
  description: >
    API REST para gestionar intercambios de libros usados.
    Utiliza JWT para autenticación y autorización por roles.

servers:
  - url: http://localhost:8080

tags:
  - name: Autenticación
    description: Inicio de sesión
  - name: Intercambios
    description: Gestión de intercambios de libros

paths:
  /login:
    post:
      tags:
        - Autenticación
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: >
        Permite iniciar sesión con usuarios de demostración.
        Devuelve un token JWT válido durante 30 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - clave
              properties:
                usuario:
                  type: string
                  example: admin
                clave:
                  type: string
                  format: password
      responses:
        "200":
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"

  /intercambios:
    get:
      tags:
        - Intercambios
      operationId: listarIntercambios
      summary: Listar intercambios
      description: Disponible para administradores y usuarios autenticados.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de intercambios registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intercambio"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

    post:
      tags:
        - Intercambios
      operationId: crearIntercambio
      summary: Crear un intercambio
      description: >
        Solo los administradores pueden crear intercambios.
        Todo intercambio nuevo comienza en estado pendiente.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntercambioNuevo"
      responses:
        "201":
          description: Intercambio creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intercambio"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Error422"

  /intercambios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del intercambio
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Intercambios
      operationId: obtenerIntercambio
      summary: Consultar un intercambio
      description: Disponible para administradores y usuarios autenticados.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Intercambio encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intercambio"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

    put:
      tags:
        - Intercambios
      operationId: actualizarIntercambio
      summary: Actualizar un intercambio
      description: >
        Solo administradores. Actualiza el libro y el solicitante
         del intercambio. El estado se modifica mediante PATCH.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntercambioActualizacion"
      responses:
        "200":
          description: Intercambio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intercambio"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"

    patch:
      tags:
        - Intercambios
      operationId: cambiarEstadoIntercambio
      summary: Cambiar estado de un intercambio
      description: >
        Solo administradores. Permite pendiente a aceptado
        o cancelado, y aceptado a entregado o cancelado.
        Las transiciones prohibidas devuelven HTTP 422.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  $ref: "#/components/schemas/EstadoIntercambio"
      responses:
        "200":
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intercambio"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"

    delete:
      tags:
        - Intercambios
      operationId: eliminarIntercambio
      summary: Eliminar un intercambio
      description: Solo administradores.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Intercambio eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - mensaje
                properties:
                  mensaje:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /salud:
    get:
      tags:
        - Autenticación
      operationId: verificarSalud
      summary: Verificar disponibilidad del servidor
      security: []
      responses:
        "200":
          description: Servidor disponible
        "405":
          description: Método HTTP no permitido

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Introducir el token JWT obtenido mediante POST /login.

  schemas:
    EstadoIntercambio:
      type: string
      description: Estado actual del intercambio
      enum:
        - pendiente
        - aceptado
        - entregado
        - cancelado

    Intercambio:
      type: object
      required:
        - id
        - libro_id
        - solicitante_id
        - estado
      properties:
        id:
          type: integer
          readOnly: true
        libro_id:
          type: integer
          minimum: 0
        solicitante_id:
          type: integer
          minimum: 0
        id_usuario_ofrece:
          type: integer
          minimum: 0
        id_usuario_recibe:
          type: integer
          minimum: 0
        fecha_solicitud:
          type:
            - string
            - "null"
          format: date-time
        fecha_confirmacion:
          type:
            - string
            - "null"
          format: date-time
        fecha_finalizacion:
          type:
            - string
            - "null"
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoIntercambio"
        observaciones:
          type: string
        creado:
          type: string
          format: date-time

    IntercambioNuevo:
      type: object
      required:
        - libro_id
        - solicitante_id
      properties:
        libro_id:
          type: integer
          minimum: 1
        solicitante_id:
          type: integer
          minimum: 1
        estado:
          type: string
          const: pendiente
          description: Opcional; si se omite, se asigna pendiente.

    IntercambioActualizacion:
      type: object
      required:
        - libro_id
        - solicitante_id
        - estado
      properties:
        libro_id:
          type: integer
          minimum: 1
        solicitante_id:
          type: integer
          minimum: 1
        estado:
          $ref: "#/components/schemas/EstadoIntercambio"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

  responses:
    Error400:
      description: Datos incorrectos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Error401:
      description: Token ausente, inválido o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Error403:
      description: El usuario no tiene permisos suficientes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Error404:
      description: Intercambio no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Error422:
      description: Estado o transición no permitida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"