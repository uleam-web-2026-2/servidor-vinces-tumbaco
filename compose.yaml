
name: kema-s7

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: intercambio_prueba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intercambio_prueba"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - kema-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/intercambio_prueba?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kema-net

volumes:
  postgres_data:

networks:
  kema-net:
    driver: bridge
